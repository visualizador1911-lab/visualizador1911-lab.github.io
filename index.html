


<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FORMATEAR TEXTO SHOTSPOTTER</title>
<style>
/* FLOATING CHAT */

#chat-widget {
    position:absolute;
    top:20px;
    right:20px;
    width:300px;
    background:#222;
    border:2px solid #8B0000;
    padding:10px;
    z-index:10;
    box-shadow:0 0 15px black;
}

#chat-widget h3 {
    margin:0 0 8px 0;
    color:#ff5555;
    font-size:18px;
    text-align:center;
}

#chat-log {
    height:90px;
    background:#000;
    border:1px solid #8B0000;
    padding:8px;
    overflow-y:auto;
    white-space:pre-wrap;
    font-family:monospace;
    font-size:12px;
}

#chat-update {
    height:15px;
    margin:4px 0;
    color:#888;
    font-size:11px;
    font-family:monospace;
}

#chat-message {
    width:100%;
    box-sizing:border-box;
    background:#333;
    color:white;
    border:1px solid #8B0000;
    padding:6px;
    font-family:monospace;
}
</style>
<style>
html, body, * { cursor: url("./CURSOR.cur"), auto; }
body {
    background-color: #000; /* fallback while image loads */
    background-image: url("./fondo.jpg");
    background-size: cover;       /* fills the screen */
    background-position: center;  /* keeps it centered */
    background-repeat: no-repeat; /* no tiling */
    background-attachment: fixed; /* optional: parallax effect */

    color: #E0CFCF;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
}
h2 {
    font-size: 3.5em;
    text-align: center;
    font-weight: bold;
    color: #F5E5E5;
    background: linear-gradient(45deg, #8B0000, #B22222, #FF4C4C);
    -webkit-background-clip: text;
    -webkit-text-fill-color: solid;
    -webkit-text-stroke: 2px black;
    text-shadow: 1px 1px 1px rgba(0,0,0,0.3), -1px -1px 1px rgba(0,0,0,0.2);
}
.float-letter {
    display: inline-block;
    animation: floatLetter 2s ease-in-out infinite;
}
@keyframes floatLetter {
    0% { transform: translateY(0px) rotate(0deg) skew(0deg, 0deg); }
    25% { transform: translateY(-4px) rotate(-2deg) skew(-1deg, 1deg); }
    50% { transform: translateY(-6px) rotate(2deg) skew(1deg, -1deg); }
    75% { transform: translateY(-4px) rotate(-1deg) skew(0.5deg, 0.5deg); }
    100% { transform: translateY(0px) rotate(0deg) skew(0deg, 0deg); }
}
textarea {
    width: 100%;
    max-width: 100%;
    min-width: 300px;
    background: linear-gradient(145deg, #4B2B2B, #6B1F1F);
    color: #F5E5E5;
    border: 2px solid #8B0000;
    padding: 10px;
    font-family: monospace;
    font-size: 14px;
    resize: vertical;
    box-sizing: border-box;
    transition: width 0.3s ease;
}
textarea::placeholder {
    font-weight: bold;
    font-size: 16px;
    color: #F5E5E5;
}
button {
    background-color: #8B0000;
    color: #F5E5E5;
    border: none;
    padding: 10px 20px;
    margin: 5px 5px 15px 0;
    font-weight: bold;
    cursor: pointer;
    border-radius: 12px;
    transition: 0.2s;
}
button:hover { background-color: #B22222; }
#counter-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 10px 0;
}
#counter {
    font-size: 1.5em;
    font-weight: bold;
    color: #CD5C5C;
}
#breakdown {
    font-size: 1em;
    margin-top: 4px;
    color: #F5E5E5;
}
#log {
    margin-top: 10px;
    max-height: 400px;
    overflow-y: auto;
    border: 2px solid #8B0000;
    padding: 10px;
    background: linear-gradient(145deg, #4B2B2B, #6B1F1F);
    font-family: monospace;
    white-space: pre;
}
.log-entry { border-bottom: 1px solid #8B0000; padding: 4px; }
.log-entry.single-event .log-content { color: #A9A9A9 !important; opacity: 0.8; }
.log-content { user-select: text; display: inline-block; }
#warning {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #A52A2A;
    color: #F5E5E5;
    padding: 12px 18px;
    border-radius: 6px;
    font-weight: bold;
    opacity: 0;
    transition: opacity .4s;
}
#warning.show { opacity: 1; }
#textarea-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}
#textarea-container textarea {
    flex: 1 1 400px;
}
</style>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>
<body>
<h2>FORMATEAR TEXTO SHOTSPOTTER</h2>
<div id="chat-widget">

<h3>CHAT NOVEDADES</h3>

<div id="chat-log">
Loading...
</div>

<div id="chat-update"></div>

<input 
id="chat-message"
maxlength="200"
placeholder="Escribir novedad..."
onkeydown="if(event.key==='Enter') enviarChat();"
>

</div>
<div id="textarea-container">
    <textarea id="input" rows="12" placeholder="LUEGO DE REALIZADO EL FILTRO EN SHOTSPOTTER PRESIONAR CTRL+A, CTRL+C Y PEGAR AQUI EL RESULTADO"></textarea>
    <textarea id="singleInput" rows="12" placeholder="PEGAR AQUÍ DE A UN EVENTO"></textarea>
</div>
<br>
<button onclick="limpiarTodo()">Limpiar</button>
<button onclick="revertLog()">Invertir Orden Cronológico</button>
<div id="counter-container">
    <div>
        <div id="counter">CANTIDAD DE EVENTOS CARGADOS: 0</div>
        <div id="breakdown">
            <span id="falsos">Falsos Positivos: 0</span> | 
            <span id="unicos">Eventos Disparo Único: 0</span> | 
            <span id="multiple">Eventos Multiple Disparo: 0</span> |
            <span id="undefinedTipo">Tipo de disparo sin definir: 0</span>
            <span id="nota">(Solo desglosa los Eventos cargados al por mayor, los individuales cuentan como indefinidos)</span>
        </div>
    </div>
    <button onclick="window.location.href='planilla.html'">Formatear planilla</button>
    <button onclick="copiarTodo()">Copiar todos los eventos</button>
</div>
<div id="log"></div>
<div id="warning"></div>
<script>
const input = document.getElementById("input");
const singleInput = document.getElementById("singleInput");
const log = document.getElementById("log");
const counter = document.getElementById("counter");

function showWarning(msg){
    const w=document.getElementById("warning");
    w.textContent=msg;
    w.classList.add("show");
    setTimeout(()=>w.classList.remove("show"),2500);
}

function parseDateFromLog(text){
    const parts=text.split("\t");
    if(!parts[1])return null;
    const [date,time]=parts[1].split(" ");
    const [d,m,y]=date.split("/").map(Number);
    const [hh,mm,ss]=time.split(":").map(Number);
    return new Date(y,m-1,d,hh,mm,ss);
}

function isDuplicateById(id){
    return [...document.querySelectorAll(".log-entry .log-content")].some(e=>e.textContent.split("\t")[0]===id);
}

function animateTextScramble(element,finalText,speed=20,callback){
    const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-={}[]<>?";
    let iteration=0;
    const interval=setInterval(()=>{
        let scrambled="";
        for(let i=0;i<finalText.length;i++){
            scrambled+=i<iteration?finalText[i]:chars[Math.floor(Math.random()*chars.length)];
        }
        element.textContent=scrambled;
        iteration++;
        if(iteration>finalText.length){
            clearInterval(interval);
            if(callback)callback();
        }
    },speed);
}

function sortLogChronologically(){
    const entries=[...log.querySelectorAll(".log-entry")];
    entries.sort((a,b)=>{
        const dateA=parseDateFromLog(a.querySelector(".log-content").textContent);
        const dateB=parseDateFromLog(b.querySelector(".log-content").textContent);
        return dateA-dateB;
    });
    entries.forEach(e=>log.appendChild(e));
    if(entries.length>1){
        const topDate=parseDateFromLog(entries[0].querySelector(".log-content").textContent);
        const bottomDate=parseDateFromLog(entries[entries.length-1].querySelector(".log-content").textContent);
        if(bottomDate<topDate)revertLog();
    }
}

function selectLogText(){
    const range=document.createRange();
    range.selectNodeContents(log);
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
}

input.addEventListener("paste",()=>setTimeout(processInput,0));

function processInput(){
    if(!input.value.trim()) return;

    let blocks = input.value.replace(/\r\n/g, "\n").trim().split(/\n\s*\n+/);
    blocks.forEach(block => {
        let lines = block.split("\n").map(l => l.trim()).filter(Boolean);
        if(lines.length < 6) return; // minimum lines

        const firstLine = lines[0];
        let id = lines[1] || "";
        let mainLine = lines[2] || "";
        let cadLine = "";
        let barrio = "";
        let coordLine = "";

        // Detect if CAD line exists (line with digits only)
        if(/\d+/.test(lines[3])) {
            cadLine = lines[3];
            barrio = lines[4] || "";
            coordLine = lines[6] || "";
        } else {
            // CAD missing, shift lines
            cadLine = "";
            barrio = lines[3] || "";
            coordLine = lines[5] || "";
        }

        const dtMatch = mainLine.match(/^(\d{2}\/\d{2}\/\d{4}\s+\d{2}:\d{2}:\d{2})/);
        if(!dtMatch) return;
        let dateTime = dtMatch[1];

        const parts = mainLine.split("\t");
        let address = parts[1] || "";
        let zona = parts[2] || "";
        let rounds = parts[3] || "";

        let lat = "", lon = "";
        const coords = coordLine.split("\t");
        if(coords.length === 2) { lat = coords[0].replace(",", "."); lon = coords[1].replace(",", "."); }

        let cad = cadLine.match(/\d+/)?.[0] || "";
        let tipo = "";
        const firstLineNorm = firstLine.trim().toLowerCase();
        if(firstLineNorm === "único-disparo" || firstLineNorm === "single gunshot") tipo = "UNICO-DISPARO";
        else if(firstLineNorm === "multiple-disparo" || firstLineNorm === "multiple gunshots") tipo = "MULTIPLE-DISPARO";
        else if(firstLineNorm === "probable-disparo" || firstLineNorm === "probable gunfire") tipo = (rounds === "1") ? "UNICO-DISPARO" : "MULTIPLE-DISPARO";
        else if(firstLineNorm === "no hay tiroteo" || firstLineNorm === "not gunfire") tipo = "NO HAY TIROTEO";

        if(!id || !dateTime || !lat || !lon) return;
        if(isDuplicateById(id)) return;

        const result = [id, dateTime, "", zona, address, rounds, barrio, lat, lon, "", tipo, cad].join("\t");
        const entry = document.createElement("div");
        entry.className = "log-entry";
        const span = document.createElement("span");
        span.className = "log-content";
        entry.appendChild(span);
        log.appendChild(entry);

        animateTextScramble(span, result, 10, () => {
            sortLogChronologically();
            updateCounter();
            updateBreakdown();
            selectLogText();
        });
    });
    input.value = "";
}

singleInput.addEventListener("paste",function(){singleInput.value="";setTimeout(()=>{convertirSingle();},0);});

function convertirSingle() {
    if (!singleInput.value.trim()) return;

    const lines = singleInput.value
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(Boolean);

    // ---------- FIND EACH LINE ----------
    const firstLine = lines[0] || "";

    const shotspotterLine = lines.find(l => /ShotSpotter\s*ID/i.test(l)) || "";
    const cadLine = lines.find(l => /CAD\s*ID/i.test(l)) || "";
    const dateLine = lines.find(l => /\d{2}\/\d{2}\/\d{4}\s*@\s*\d{2}:\d{2}:\d{2}/.test(l)) || "";
    const districtLine = lines.find(l => /Distrito|Sector|Beat/i.test(l)) || "";
    const barrioLine = lines.find(l => /^UY/i.test(l)) || "";
    const coordLine = lines.find(l => /^-?\d+,\d+\s*,\s*-?\d+,\d+/.test(l)) || "";

    // ---------- ID ----------
    const id =
        (shotspotterLine.match(/ShotSpotter\s*ID\s*([A-Za-z0-9-]+)/i) || [])[1] || "";

    // ---------- CAD ----------
    const sivve =
        (cadLine.match(/CAD\s*ID\s*(\d+)/i) || [])[1] || "";

    // ---------- DATE ----------
    const dateMatch = dateLine.match(/(\d{2}\/\d{2}\/\d{4})\s*@\s*(\d{2}:\d{2}:\d{2})/);
    const dateTime = dateMatch
        ? `${dateMatch[1]} ${dateMatch[2]}`
        : "";

    // ---------- ADDRESS ----------
    let address = firstLine;

    // remove leading "1 Bala", "2 Balas", etc.
    address = address.replace(/^\d+\s+\S+\s+en\s+/i, "");

    // fallback
    if (!address)
        address = (firstLine.match(/(?:en|at)\s+(.*)/i) || [])[1] || "";

    // ---------- ROUNDS ----------
    const round =
        (firstLine.match(/^(\d+)/) || [])[1] || "";

    // ---------- ZONE / DISTRICT ----------
    let zona = "";

    const districtMatch =
        districtLine.match(/Sector\s+(.*)$/i) ||
        districtLine.match(/Beat[:\s]*(.*)$/i);

    if (districtMatch)
        zona = districtMatch[1].trim();

    // ---------- COORDINATES ----------
    let lat = "";
    let lon = "";

    const coordMatch = coordLine.match(
        /(-?\d+(?:,\d+)?)\s*,\s*(-?\d+(?:,\d+)?)/
    );

    if (coordMatch) {
        lat = coordMatch[1].replace(",", ".");
        lon = coordMatch[2].replace(",", ".");
    }

    // ---------- VALIDATION ----------
    const missing = [];

    if (!id) missing.push("ShotSpotter ID");
    if (!dateTime) missing.push("Fecha/Hora");
    if (!address) missing.push("Dirección");
    if (!lat) missing.push("Latitud");
    if (!lon) missing.push("Longitud");

    if (missing.length) {
        showWarning("❗ Campos faltantes: " + missing.join(", "));
        return;
    }

    if (isDuplicateById(id)) {
        showWarning("⚠ Este evento ya está agregado");
        return;
    }

    // ---------- BUILD RESULT ----------
    const result = [
        id,
        dateTime,
        "",
        barrioLine,
        address,
        round,
        zona,
        lat,
        lon,
        "",
        "",
        sivve
    ].join("\t");

    const entry = document.createElement("div");
    entry.className = "log-entry single-event";

    const span = document.createElement("span");
    span.className = "log-content single-event";

    entry.appendChild(span);
    log.appendChild(entry);

    animateTextScramble(span, result, 10, () => {
        sortLogChronologically();
        updateCounter();
        updateBreakdown();
        selectLogText();
        showWarning("✔ Evento único agregado");
    });

    singleInput.value = "";
}

function revertLog(){
    const entries=[...log.querySelectorAll(".log-entry")];
    entries.reverse().forEach(e=>log.appendChild(e));
}

function updateCounter(){
    counter.textContent="CANTIDAD DE EVENTOS CARGADOS: "+document.querySelectorAll(".log-entry").length;
}

function updateBreakdown() {
    const entries = document.querySelectorAll(".log-entry .log-content");
    let falsos = 0, unico = 0, multiple = 0, undefinedTipo = 0;

    entries.forEach(e => {
        const tipo = e.textContent.split("\t")[10];
        if (tipo === "NO HAY TIROTEO") falsos++;
        else if (tipo === "UNICO-DISPARO") unico++;
        else if (tipo === "MULTIPLE-DISPARO") multiple++;
        else if (!tipo || tipo.trim() === "") undefinedTipo++;
    });

    document.getElementById("falsos").textContent = `Falsos Positivos: ${falsos}`;
    document.getElementById("falsos").style.color = "gray";

    document.getElementById("unicos").textContent = `Eventos Disparo Único: ${unico}`;
    document.getElementById("unicos").style.color = "orange";

    document.getElementById("multiple").textContent = `Eventos Multiple Disparo: ${multiple}`;
    document.getElementById("multiple").style.color = "red";

    document.getElementById("undefinedTipo").textContent = `Tipo de disparo sin definir: ${undefinedTipo}`;
    document.getElementById("undefinedTipo").style.color = "white";
}

function limpiarTodo(){
    input.value="";
    singleInput.value="";
    log.innerHTML="";
    updateCounter();
    updateBreakdown();
}

function copiarTodo(){
    if(!log.textContent.trim()){showWarning("⚠ No hay eventos para copiar");return;}
    const text=Array.from(log.querySelectorAll(".log-content")).map(e=>e.textContent).join("\n");
    navigator.clipboard.writeText(text).then(()=>{showWarning("✔ Todos los eventos copiados al portapapeles");}).catch(()=>{showWarning("⚠ Error al copiar al portapapeles");});
}

const title = document.querySelector("h2");
title.innerHTML = title.textContent.split("").map(letter=>`<span class="float-letter">${letter}</span>`).join("");
const titleLetters=document.querySelectorAll(".float-letter");
titleLetters.forEach(span=>{
    const delay=(Math.random()*2).toFixed(2);
    const duration=(1.5+Math.random()).toFixed(2);
    span.style.animationDelay=`${delay}s`;
    span.style.animationDuration=`${duration}s`;
});
// ===============================
// CHAT NOVEDADES
// ===============================

const CHAT_URL =
"https://script.google.com/macros/s/AKfycbyJ6yjRGaTCH5pdBSKhyWGW5uXpW7ttg1jvKbE6oNN-IbSHFCfa4hE1rQrtLsOrLKco/exec";


async function cargarChat(){

    try {

        const response =
        await fetch(
            CHAT_URL + "?t=" + Date.now()
        );

        const data =
        await response.json();


        document.getElementById("chat-log")
        .textContent =
        data.join("\n");


        const box =
        document.getElementById("chat-log");

        box.scrollTop =
        box.scrollHeight;

    }

    catch(error){

        console.log(error);

    }

}



async function enviarChat(){

    const input =
    document.getElementById("chat-message");

    const update =
    document.getElementById("chat-update");


    const msg =
    input.value.trim();


    if(!msg)
        return;


    input.value="";


    const now = new Date();

const timestamp =
"[" +
String(now.getDate()).padStart(2,"0") +
"/" +
String(now.getMonth()+1).padStart(2,"0") +
"/" +
now.getFullYear() +
" " +
String(now.getHours()).padStart(2,"0") +
":" +
String(now.getMinutes()).padStart(2,"0") +
":" +
String(now.getSeconds()).padStart(2,"0") +
"] ";


const finalMessage =
timestamp + msg;


await fetch(
    CHAT_URL +
    "?message=" +
    encodeURIComponent(finalMessage) +
    "&t=" +
    Date.now()
);


    let count=5;


    update.textContent =
    "Actualizando en " + count;


    const timer =
    setInterval(()=>{


        count--;


        if(count>0){

            update.textContent =
            "Actualizando en " + count;

        }

        else{

            clearInterval(timer);

            update.textContent =
            "Actualizando...";


            cargarChat();


            setTimeout(()=>{

                update.textContent="";

            },1000);

        }


    },1000);

}



cargarChat();


setInterval(
    cargarChat,
    5000
);
</script>
</body>
</html>
