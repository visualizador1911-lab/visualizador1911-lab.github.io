<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shared Work Chat</title>

<style>
body {
    background:#111;
    color:#eee;
    font-family:Arial, sans-serif;
    padding:30px;
}

h2 {
    color:#ff5555;
}

#chat-box {
    width:400px;
    background:#222;
    border:2px solid #8B0000;
    padding:15px;
}

#chat-log {
    height:180px;
    background:#000;
    border:1px solid #8B0000;
    padding:10px;
    overflow-y:auto;
    white-space:pre-wrap;
    font-family:monospace;
    margin-bottom:10px;
}

#message {
    width:280px;
    background:#333;
    color:white;
    border:1px solid #8B0000;
    padding:8px;
}

button {
    background:#8B0000;
    color:white;
    border:none;
    padding:8px 15px;
    cursor:pointer;
}

button:hover {
    background:#B22222;
}

#status {
    margin-top:10px;
    color:#ffcc00;
    font-family:monospace;
}
</style>

</head>

<body>

<h2>Shared Work Notes</h2>

<div id="chat-box">

<div id="chat-log">
Loading...
</div>

<input 
id="message"
maxlength="200"
placeholder="Write message..."
>

<button onclick="sendMessage()">
SEND
</button>

<div id="status"></div>

</div>


<script>

const CHAT_URL =
"https://script.google.com/macros/s/AKfycbymkb87fp84Yn6SfdxTOHRd4svpfsdYs4pVayy-a2RmowVMBPUR7aUhIgNM-K7o5JmI/exec";



async function loadChat(){

    try {

        const response =
            await fetch(CHAT_URL + "?t=" + Date.now());


        const data =
            await response.json();


        document.getElementById("chat-log")
            .textContent =
            data.join("\n");


        document.getElementById("status")
            .textContent =
            "";


    }
    catch(error){

        document.getElementById("status")
            .textContent =
            "READ ERROR: " + error;

    }

}



async function sendMessage(){

    const input =
        document.getElementById("message");


    const msg =
        input.value.trim();


    if(!msg)
        return;


    try {

        await fetch(
            CHAT_URL +
            "?message=" +
            encodeURIComponent(msg) +
            "&t=" +
            Date.now()
        );


        input.value="";

        loadChat();


    }
    catch(error){

        document.getElementById("status")
            .textContent =
            "SEND ERROR: " + error;

    }

}



loadChat();


setInterval(
    loadChat,
    5000
);


</script>

</body>
</html>
